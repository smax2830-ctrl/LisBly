<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISBLY - Fazer Login</title>
    <link rel="stylesheet" href="login.css">

    <style>
        .login-container {
            text-align: center;
        }

        .welcome {
            text-align: center;
        }

        .welcome h1 {
            text-align: center;
        }

        .welcome p {
            text-align: center;
            margin-top: 10px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-top: 30px;
            text-align: left;
        }

        .login-form label {
            display: block;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .login-form input {
            display: block;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            border-radius: 9px;
        }

        .submit-btn {
            width: 100%;
            margin-top: 12px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            line-height: 1.8;
        }

        .register-link a {
            display: inline-block;
        }
    </style>
</head>

<body>

    <main class="login-container">

        <header class="logo">
            <div class="logo-icon">L</div>
            <h2>LISBLY</h2>
        </header>

        <section class="welcome">
            <h1>Fazer Login</h1>
            <p>Entre com e-mail e senha</p>
        </section>

        <form class="login-form" id="formLogin">

            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required>
            </div>

            <button type="submit" class="submit-btn">
                Entrar
            </button>

        </form>

        <div class="register-link">
           <p class="cadastro.link">
            Não tem uma conta?
            <a href="criarconta.html">Criar Conta</a>
           </p>
        </div>

    </main>

    <script>
        document.getElementById("formLogin")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                alert("Tela de login organizada! A autenticação ainda precisa ser implementada.");
            });
    </script>

</body>
</html>
