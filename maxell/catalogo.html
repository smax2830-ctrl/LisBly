<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LISBLY - Catálogo</title>

    <link rel="stylesheet" href="catalogo.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="topo">

        <div class="logo">
            <div class="logo-icon">L</div>
            <h1>LISBLY</h1>
        </div>

        <nav class="menu">
            <a href="catalogo.html" class="ativo">Catálogo</a>
            <a href="emprestimos.html">Empréstimos</a>
        </nav>

        <div class="usuario">
            <span class="avatar">L</span>
        </div>

    </header>


    <!-- CONTEÚDO -->
    <main class="conteudo">

        <!-- PESQUISA -->
        <div class="pesquisa">
            <span>⌕</span>
            <input type="text"
                placeholder="Buscar título ou autor...">
        </div>


        <!-- CATEGORIAS -->
        <div class="categorias">
            <button class="btn-categoria ativo"
            onclick="filtrarLivros('todos', this)">Todos</button>

            <button class="btn-categoria"
            onclick="window.location.href='romance.html'">Romance</button>

            <button class="btn-categoria"
            onclick class="window.location.href='naturalismo.html">Naturalismo</button>

            <button class="btn-categoria"
            onclick="window.location.href='Modernismo'">Modernismo</button>

            <button class="btn-categoria"
            onclick="window.location.href='romantismo.html'">Romantismo</button>

            <button class="btn-categoria"
            onclick="window.location.href='romance.social.html'">Romance-Social</button>
            

        </div>


        <!-- LIVRO QUINCAS BORBA -->
        <section class="livro livro-laranja">

            <div class="capa capa-laranja">
                <span>Quincas<br>Borba</span>
            </div>

            <div class="info-livro">

                <h2>Quincas Borba</h2>

                <p>Machado de Assis</p>

                <div class="etiquetas">
                    <span class="tag">Romance</span>
                    <span class="tag">1899</span>
                </div>

            </div>

            <div class="status">

                <p><strong>2</strong> / 3 disponíveis</p>

                <span class="disponivel">Disponível</span>

            </div>

            <button class="botao-emprestimo">
                Solicitar Empréstimo
            </button>

        </section>


        <!-- LIVRO GRANDE SERTÃO -->
        <section class="livro livro-verde">

            <div class="capa capa-verde">
                <span>Grande<br>Sertão:<br>Veredas</span>
            </div>

            <div class="info-livro">

                <h2>Grande Sertão: Veredas</h2>

                <p>João Guimarães Rosa</p>

                <div class="etiquetas">
                    <span class="tag">Romance</span>
                    <span class="tag">1956</span>
                </div>

            </div>

            <div class="status">

                <p><strong>0</strong> / 1 disponíveis</p>

                <span class="indisponivel">Indisponível</span>

            </div>

            <button class="botao-emprestimo" disabled>
                Indisponível
            </button>

        </section>


    </main>

</body>
</html>
